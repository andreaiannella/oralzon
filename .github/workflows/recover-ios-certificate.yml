name: "Temporary - Recover iOS certificate"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Conferma il recupero del certificato (lascia RECOVER)
        required: true
        default: "RECOVER"
        type: string

permissions:
  contents: read

jobs:
  recover-certificate:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_RECOVERY_PASSWORD: ${{ secrets.IOS_RECOVERY_PASSWORD }}

    steps:
      - name: Validate recovery secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RECOVER" || { echo "::error::Lascia RECOVER nel campo di conferma."; exit 1; }
          test -n "$IOS_CERTIFICATE_BASE64" || { echo "::error::Secret IOS_CERTIFICATE_BASE64 mancante."; exit 1; }
          test -n "$IOS_CERTIFICATE_PASSWORD" || { echo "::error::Secret IOS_CERTIFICATE_PASSWORD mancante."; exit 1; }
          test -n "$IOS_RECOVERY_PASSWORD" || { echo "::error::Crea prima il Secret IOS_RECOVERY_PASSWORD."; exit 1; }
          test "${#IOS_RECOVERY_PASSWORD}" -ge 16 || { echo "::error::IOS_RECOVERY_PASSWORD deve contenere almeno 16 caratteri."; exit 1; }

      - name: Import existing certificate into a temporary keychain
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/oralzon-recovery.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/oralzon-original.p12"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | openssl base64 -d -A -out "$CERTIFICATE_PATH"
          test -s "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Apple Distribution|iPhone Distribution/{print $2; exit}')"
          test -n "$SIGNING_IDENTITY" || { echo "::error::Il P12 non contiene una identita Apple Distribution utilizzabile."; exit 1; }

          echo "RECOVERY_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Re-export certificate with the new password
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          RECOVERED_P12="$RUNNER_TEMP/oralzon-certificate-recovered.p12"

          security export \
            -k "$RECOVERY_KEYCHAIN_PATH" \
            -t identities \
            -f pkcs12 \
            -P "$IOS_RECOVERY_PASSWORD" \
            -o "$RECOVERED_P12"

          test -s "$RECOVERED_P12"
          base64 < "$RECOVERED_P12" | tr -d '\n' > output/IOS_DISTRIBUTION_CERTIFICATE_BASE64.txt
          shasum -a 256 "$RECOVERED_P12" > output/oralzon-certificate-recovered.p12.sha256
          {
            echo "NEXUM GitHub Secret:"
            echo "IOS_DISTRIBUTION_CERTIFICATE_BASE64 = contenuto del file IOS_DISTRIBUTION_CERTIFICATE_BASE64.txt"
            echo "IOS_P12_PASSWORD = la nuova password salvata come IOS_RECOVERY_PASSWORD in Oralzon"
            echo
            echo "Questo pacchetto scade automaticamente dopo 1 giorno."
          } > output/LEGGIMI.txt

      - name: Upload protected recovery package
        uses: actions/upload-artifact@v4
        with:
          name: Oralzon-iOS-certificate-recovery
          path: output/
          retention-days: 1
          if-no-files-found: error
