name: Build Android App

# Si attiva a mano dalla scheda "Actions" di GitHub — non serve un Mac,
# Android si compila su un runner Linux normale.
on:
  workflow_dispatch:
    inputs:
      variante:
        description: "Quale app compilare"
        required: true
        default: cliente
        type: choice
        options:
          - cliente
          - venditore

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installa dipendenze
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: |
          if [ "${{ github.event.inputs.variante }}" = "venditore" ]; then
            npm run build:seller
          else
            npm run build
          fi

      - name: Sync Capacitor
        run: |
          if [ "${{ github.event.inputs.variante }}" = "venditore" ]; then
            npx cap sync android --config capacitor.config.seller.json
          else
            npx cap sync android
          fi

      # La firma dell'app (keystore) va caricata come Secret di repository —
      # vedi le istruzioni in ANDROID_RELEASE.md prima di lanciare questo step
      - name: Decodifica keystore di firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/oralzon-release.keystore
            echo "Keystore decodificato correttamente."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 non impostato — il bundle risultante NON sarà firmato."
          fi

      - name: Imposta identificativo e nome per la variante venditore
        # Stessa ragione di iOS: `cap sync` non tocca applicationId, che sta
        # in build.gradle. Senza questo le due app risulterebbero la stessa
        # sul Play Store.
        #
        # Il namespace NON si cambia: è il nome del package Java delle classi
        # generate, e modificarlo romperebbe la compilazione. Sul Play Store
        # conta applicationId.
        if: ${{ github.event.inputs.variante == 'venditore' }}
        run: |
          sed -i 's/applicationId "com.oralzon.myapp"/applicationId "com.oralzon.seller"/' \
            android/app/build.gradle
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">Oralzon Seller</string>|' \
            android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">Oralzon Seller</string>|' \
            android/app/src/main/res/values/strings.xml
          echo "Compilo Oralzon Seller (com.oralzon.seller)"

      - name: Build Android App Bundle (.aab)
        working-directory: android
        env:
          ORALZON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORALZON_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORALZON_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease

      - name: Carica il file .aab come risultato
        uses: actions/upload-artifact@v4
        with:
          name: oralzon-android-release
          path: android/app/build/outputs/bundle/release/app-release.aab
