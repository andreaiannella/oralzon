<!DOCTYPE html>
<html lang="it">
  <head>
    <!-- Consent Mode: lo stato di default è "negato" finché l'utente non
         accetta esplicitamente dal banner cookie (vedi CookieBanner.tsx) —
         va dichiarato PRIMA che gtag.js si carichi, altrimenti la prima
         chiamata a gtag('config', ...) partirebbe già con permessi pieni.
         Senza questo, il banner cookie sarebbe solo scenografia: mostra una
         scelta ma non blocca comunque nulla, un problema di conformità reale
         per un sito che opera in UE, non solo estetico. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied'
      });
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0BQPPH6TEB"></script>
    <script>
      gtag('js', new Date());
      // NESSUN SEGNALE PUBBLICITARIO, MAI.
      //
      // Apple ha chiesto (revisione 16/08/2026, Guideline 2.1) se i dati
      // raccolti vengano collegati a dati di terze parti per finalità di
      // marketing. Finché lo strumento dichiara di poter trattare
      // ad_storage / ad_user_data / ad_personalization, la risposta "no"
      // resta vera solo per configurazione — e una configurazione si può
      // cambiare per sbaglio dal pannello Google senza toccare il codice.
      //
      // Qui i segnali pubblicitari vengono negati in modo permanente e
      // indipendente dal consenso: il banner può concedere le statistiche,
      // ma non può concedere la pubblicità perché non gliene diamo la
      // facoltà. Così la risposta ad Apple è vera per costruzione, e resta
      // vera anche se un domani qualcuno collegasse per errore un account
      // Google Ads.
      //
      // Conseguenza voluta: Oralzon non fa tracciamento nel senso definito
      // da Apple, quindi non serve il framework ATT e non va dichiarato
      // alcun tracking nella scheda privacy.
      gtag('set', 'allow_google_signals', false);
      gtag('set', 'allow_ad_personalization_signals', false);
      gtag('config', 'G-0BQPPH6TEB', { anonymize_ip: true });
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Il font non blocca più il primo disegno della pagina: il browser
      può mostrare subito il testo con un font di riserva e passare al
      font vero appena arriva (che è comunque quello che avrebbe fatto
      display=swap, solo dopo aver aspettato lo stylesheet). onload cambia
      il link da "print" (ignorato per lo schermo, quindi non bloccante)
      ad "all" non appena il file è arrivato. noscript copre chi ha
      JavaScript disattivato.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" /></noscript>
    <title>Oralzon — Marketplace Prodotti Odontoiatrici Professionali</title>
    <meta name="description" content="Il marketplace professionale per studi dentistici. Acquista strumenti odontoiatrici, materiali, monouso, sterilizzazione e implantologia da fornitori verificati. Spedizione rapida in tutta Italia." />
    <!-- Il meta keywords è stato rimosso deliberatamente: Google lo ignora
         dal 2009 e Bing può interpretarne l'abuso come segnale di spam.
         Le parole chiave degli articoli sono nei dati strutturati
         schema.org (vedi BlogArticle.tsx), che i motori leggono davvero. -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Oralzon" />
    <link rel="canonical" href="https://oralzon.com" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oralzon — Marketplace Prodotti Odontoiatrici" />
    <meta property="og:description" content="Il marketplace professionale per studi dentistici. Acquista da fornitori verificati con spedizione rapida." />
    <meta property="og:url" content="https://oralzon.com" />
    <meta property="og:site_name" content="Oralzon" />
    <meta property="og:locale" content="it_IT" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oralzon — Marketplace Prodotti Odontoiatrici" />
    <meta name="twitter:description" content="Il marketplace professionale per studi dentistici." />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Oralzon",
      "url": "https://oralzon.com",
      "description": "Marketplace professionale per prodotti odontoiatrici",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://oralzon.com/negozio?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Oralzon",
      "url": "https://oralzon.com",
      "description": "Marketplace B2B per forniture odontoiatriche professionali",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": "Italian"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
